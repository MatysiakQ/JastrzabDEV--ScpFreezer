name: Regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/Regression/Regression.csproj --configuration Release
